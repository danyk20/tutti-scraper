name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install the exact versions pinned in Pipfile.lock - the same ones
      # `pipenv install --dev` gives you locally - so CI and the dev
      # environment can't disagree (e.g. on how ruff formats code).
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv requirements --dev > "$RUNNER_TEMP/requirements.txt"
          pip install -r "$RUNNER_TEMP/requirements.txt"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy tutti_scraper.py

      - name: Unit tests (no network, e2e excluded)
        run: pytest

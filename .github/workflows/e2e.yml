name: E2E (live API)

on:
  schedule:
    # Every Monday at 06:00 UTC. Keeps this off the main CI path (real
    # network calls against tutti.ch shouldn't run on every push) while
    # still giving an early warning if tutti.ch changes their API shape.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies (same versions as `pipenv install --dev`)
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv requirements --dev > "$RUNNER_TEMP/requirements.txt"
          pip install -r "$RUNNER_TEMP/requirements.txt"

      - name: End-to-end tests against the live API
        run: pytest -m e2e --no-cov
